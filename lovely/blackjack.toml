            for i = 1, #G.jokers.cards do
                G.jokers.cards[i]:set_debuff()
            end
            G.GAME.current_round.current_hand.mult = tostring(mult)
            G.hand_text_area.mult:update(0)
            return true
        end
    }))
end'''
